{% extends "public_site/base.html" %}

{% block content %}
<style>
  .auth-wrapper {
    max-width: 500px;
    margin: 3rem auto;
    padding: 0 1rem;
  }
  .auth-wrapper--wide {
    max-width: 720px;
  }
  .auth-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 2.25rem;
    box-shadow: 0 4px 16px rgba(15, 41, 24, 0.08);
  }
  .auth-card h1 {
    color: #14331b;
    font-size: 1.75rem;
    margin-top: 0;
    margin-bottom: 0.5rem;
  }
  .auth-subtitle {
    color: #4a5568;
    font-size: 0.95rem;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }
  .auth-field {
    margin-bottom: 1.15rem;
  }
  .auth-field label {
    display: block;
    font-weight: 600;
    color: #1a202c;
    margin-bottom: 0.35rem;
    font-size: 0.92rem;
  }
  .auth-card input[type="text"],
  .auth-card input[type="email"],
  .auth-card input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.85rem;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 1rem;
    background-color: #f8fafc;
    color: #1a202c;
    box-sizing: border-box;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .auth-card input:focus {
    outline: none;
    border-color: #2e5a27;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(46, 90, 39, 0.15);
  }
  .auth-help {
    display: block;
    color: #64748b;
    font-size: 0.8rem;
    margin-top: 0.25rem;
  }
  .auth-error,
  .auth-card .errorlist {
    color: #b91c1c;
    font-size: 0.85rem;
    margin: 0.3rem 0 0;
    padding-left: 0;
    list-style: none;
  }
  .auth-alert {
    padding: 0.85rem 1rem;
    border-radius: 6px;
    margin-bottom: 1.25rem;
    font-size: 0.92rem;
    background-color: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
  }
  .auth-alert--error {
    background-color: #fef2f2;
    border-color: #fecaca;
    color: #991b1b;
  }
  .auth-btn {
    display: inline-block;
    width: 100%;
    padding: 0.75rem 1.25rem;
    background-color: #d97706;
    color: #ffffff;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    margin-top: 0.5rem;
    transition: background-color 0.15s ease;
  }
  .auth-btn:hover {
    background-color: #b45309;
  }
  .auth-btn--secondary {
    background-color: #14331b;
    width: auto;
  }
  .auth-btn--secondary:hover {
    background-color: #1f4d29;
  }
  .auth-links {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid #e2e8f0;
    font-size: 0.92rem;
    color: #4a5568;
  }
  .auth-links p {
    margin: 0.4rem 0;
  }
  .auth-links a {
    color: #2e5a27;
    font-weight: 600;
    text-decoration: none;
  }
  .auth-links a:hover {
    text-decoration: underline;
  }
</style>

<div class="auth-wrapper {% block wrapper_class %}{% endblock %}">
  <div class="auth-card">
    {% block auth_content %}{% endblock %}
  </div>
</div>
{% endblock %}
